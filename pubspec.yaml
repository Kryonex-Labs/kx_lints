name: kx_lints
description: >-
  Opinionated Flutter lint rules that catch real bugs via custom_lint —
  file length, widget structure, theme access, magic numbers, hardcoded
  strings, and more. Configurable per-rule thresholds, quick-fixes included.
version: 0.0.3
repository: https://github.com/Kryonex-Labs/kx_lints
issue_tracker: https://github.com/Kryonex-Labs/kx_lints/issues
homepage: https://github.com/Kryonex-Labs/kx_lints
documentation: https://github.com/Kryonex-Labs/kx_lints
topics:
  - lints
  - flutter
  - custom-lint
  - static-analysis
  - code-quality

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: ^8.0.0
  custom_lint_builder: ^0.8.0

dev_dependencies:
  test: ^1.25.0
